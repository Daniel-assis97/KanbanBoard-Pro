<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanbanBoard Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="title-box">
            <h1>KanbanBoard Pro</h1>
            <img src="imports/folder.png">
        </div>
        <div class="links">
            <a href="#" class="item">Home</a>
            <a href="#" class="item">Sobre</a>
            <a href="#" class="item">Contatos</a>
            <button class="btn-dark">Modo Escuro</button>
        </div>
    </header>
    <main class="container">
        <div class="container-box">
            <div class="column-title">
                <h3>A Fazer</h3>
                <button class="btn-submit">+</button>
            </div>
            <section class="column-cards" id="todo">

            </section>
        </div>
        <div class="container-box">
            <div class="column-title">
                <h3>Em Andamento</h3>
                <button class="btn-submit">+</button>
            </div>
            <section class="column-cards" id="working">

            </section>
        </div>
        <div class="container-box">
            <div class="column-title">
                <h3>Concluído</h3>
                <button class="btn-submit">+</button>
            </div>
            <section class="column-cards" id="done">
           
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
